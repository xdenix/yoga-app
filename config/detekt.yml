build:
  maxIssues: 0
  excludeCorrectable: false
  weights: {}

config:
  validation: true
  warningsAsErrors: false

processors:
  active: true

comments:
  active: true
  OutdatedDocumentation:
    active: true
  UndocumentedPublicClass:
    active: false # too noisy on data classes
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 80
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 8
  CyclomaticComplexMethod:
    active: true
    threshold: 20
  ComplexCondition:
    active: true
    threshold: 5
  TooManyFunctions:
    active: false # ViewModels naturally have many small functions
  LargeClass:
    active: true
    threshold: 250
  NestedBlockDepth:
    active: true
    threshold: 5

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true
  SuspendFunWithFlowReturnType:
    active: true

empty-blocks:
  active: true
  EmptyFunctionBlock:
    active: false # allowed for no-op overrides
  EmptyCatchBlock:
    active: true
  EmptyClassBlock:
    active: true

exceptions:
  active: true
  SwallowedException:
    active: true
  TooGenericExceptionCaught:
    active: false # we use catch(Throwable) inside resultOf deliberately

formatting:
  active: true
  MaximumLineLength:
    active: true
    maxLineLength: 140

naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '([a-z][a-zA-Z0-9]*)|(`.*`)'
    excludes:
      - '**/build/**'
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][A-Za-z0-9_]*'
  InvalidPackageDeclaration:
    active: true
  MatchingDeclarationName:
    active: true
  NonBooleanPropertyPrefixedWithIs:
    active: true
  VariableMaxLength:
    active: false
  VariableMinLength:
    active: false

performance:
  active: true
  ForEachOnRange:
    active: true
  SpreadOperator:
    active: true
  UnnecessaryTemporaryInstantiation:
    active: true

potential-bugs:
  active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  EqualsWithHashCodeExist:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true
  UnsafeCallOnNullableType:
    active: true
  UselessPostfixExpression:
    active: true

style:
  active: true
  ForbiddenComment:
    active: true
    values:
      - 'STOPSHIP'
      - 'XXX'
    # Allow TODO since we mark them as // STUB: per ТЗ instead.
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  WildcardImport:
    active: true
    excludes: ['**/test/**']
  UseDataClass:
    active: true
  UnusedPrivateProperty:
    active: true
  UnusedPrivateMember:
    active: true
